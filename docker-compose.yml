version: "3.8"

networks:
  app-network:
    driver: bridge

services:
  frontend:
    build:
      context: ./new-frontend
      dockerfile: Dockerfile
    container_name: latex-frontend
    ports:
      - "80:80"
    restart: always
    networks:
      - app-network

  # Backend Service (Node.js API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latex-backend
    ports:
      - "3001:3001"
    restart: always
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@latex_db_instance:27017/latex-app?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PREPROCESS_URL=http://python-preprocess:8000/preprocess
      - UMAMI_URL=http://svra-ubuntu-server-0161.virtual.cloud.tuke.sk:9000
      - LATEX_COMPILER_URL=http://latex-compiler:8080
    volumes:
      - latex-temp:/tmp/latex
    depends_on:
      latex_db_instance:
        condition: service_healthy
      python-preprocess:
        condition: service_started
      latex-compiler:
        condition: service_started
    networks:
      - app-network

  # Database Service (MongoDB)
  latex_db_instance:
    image: mongo:latest
    container_name: latex_db_instance
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: |
        mongosh --host latex_db_instance \
                --authenticationDatabase admin \
                -u ${MONGO_ROOT_USERNAME} \
                -p ${MONGO_ROOT_PASSWORD} \
                --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: latex_db_instance
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    depends_on:
      latex_db_instance:
        condition: service_healthy
    networks:
      - app-network

  # Python preprocessing service (FastAPI + OpenCV)
  python-preprocess:
    build:
      context: ./python-preprocess
      dockerfile: Dockerfile
    container_name: latex-preprocess
    restart: always
    ports:
      - "8000:8000"
    networks:
      - app-network

  # LaTeX compilation service (FastAPI + TeXLive)
  latex-compiler:
    build:
      context: ./latex-compiler
      dockerfile: Dockerfile
    container_name: latex-compiler
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - latex-temp:/tmp/latex
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  latex-temp:
